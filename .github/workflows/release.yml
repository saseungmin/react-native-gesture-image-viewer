name: Release

on:
  push:
    branches:
      - main
      - next
      - v1.x

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2 (Changesets CLI 3)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          version-script: 'pnpm changeset version'
          publish-script: 'pnpm changeset publish'
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
